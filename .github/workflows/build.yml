name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: swift test --package-path Core

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project RecoveryLab.xcodeproj -scheme RecoveryLab -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1 || true
          grep -E "error:|warning: var|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -80 || true
          if [ ! -d build/Build/Products/Release-iphoneos/RecoveryLab.app ]; then
            echo "---- last lines of the build log ----"
            tail -40 build.log
            exit 1
          fi

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/RecoveryLab.app Payload/
          zip -qry RecoveryLab.ipa Payload
          ls -la RecoveryLab.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: RecoveryLab-ipa
          path: RecoveryLab.ipa

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest RecoveryLab.ipa --target "$GITHUB_SHA" \
            --title "Recovery Lab (latest build)" \
            --notes "Unsigned build of commit $GITHUB_SHA. Install it on your own iPhone with Sideloadly or AltStore."
