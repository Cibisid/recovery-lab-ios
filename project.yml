name: RecoveryLab
options:
  bundleIdPrefix: com.cibisid
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  RecoveryLab:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core/Sources/RecoveryCore
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Recovery Lab
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes:
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: Recovery Lab connects to your heart-rate band to record heart rate and heart rate variability.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cibisid.recoverylab
        PRODUCT_NAME: RecoveryLab
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: "NO"
    scheme: {}
